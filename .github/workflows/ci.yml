# CI: lint and test on Windows, Linux and macOS, then build the apps on each and smoke-test them.
# Uploaded as artifacts, per OS:
#   sensortest-<OS>            the station app: Windows .exe, Linux binary, macOS .app (zipped)
#   sensortest-selftest-<OS>   the self-test app: runs the test suite without Python
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen  # GUI tests run without a display
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (no hardware, no bench data)
        run: python -m pytest

      - name: Build the apps and smoke-test them (the self-test app runs the whole suite)
        run: python tools/build_app.py

      - name: Zip the macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/sensortest.app dist/sensortest-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sensortest-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'dist/sensortest.exe' || runner.os == 'macOS' && 'dist/sensortest-macos.zip' || 'dist/sensortest' }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sensortest-selftest-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'dist/sensortest-selftest.exe' || 'dist/sensortest-selftest' }}
          if-no-files-found: error
